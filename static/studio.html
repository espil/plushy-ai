<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plushy AI Studio</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 860px;
         margin: 2rem auto; padding: 0 1.2rem; background: #141414; color: #eee; }
  h1 { font-size: 1.6rem; }
  h1 small { color: #888; font-weight: normal; font-size: 0.9rem; }
  .card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px;
          padding: 1.2rem; margin-bottom: 1rem; }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: end; }
  label { display: flex; flex-direction: column; gap: .3rem; font-size: .85rem; color: #aaa; }
  select, input[type=number], textarea { background: #222; color: #eee;
          border: 1px solid #444; border-radius: 8px; padding: .5rem .7rem; font-size: 1rem; }
  textarea { width: 100%; min-height: 4.5rem; resize: vertical; box-sizing: border-box; }
  button.go { background: #3a7bd5; color: #fff; border: none; border-radius: 8px;
          padding: .7rem 1.6rem; font-size: 1rem; cursor: pointer; }
  button.go:disabled { background: #444; cursor: wait; }
  .progress { height: 10px; background: #222; border-radius: 6px; overflow: hidden;
          margin: .8rem 0 .3rem; display: none; }
  .bar { height: 100%; width: 0%; background: #3a7bd5; transition: width .3s; }
  .status { color: #aaa; font-size: .9rem; min-height: 1.4em; }
  .error { color: #f66; font-size: .9rem; white-space: pre-wrap; }
  #spriteOut { max-width: 100%; max-height: 480px; border-radius: 12px; display: none;
          margin-top: .6rem;
          background: repeating-conic-gradient(#2a2a2a 0 25%, #1a1a1a 0 50%) 0 0/24px 24px; }
  .actions { margin-top: .8rem; display: none; gap: .8rem; }
  .actions a { background: #2a2a2a; color: #eee; padding: .6rem 1.2rem;
          border-radius: 8px; text-decoration: none; border: 1px solid #444; }
  .note { color: #777; font-size: .8rem; margin-top: 1rem; }
</style>
</head>
<body>
<h1>🧸 Plushy AI Studio <small>text → sprite</small></h1>

<div class="card">
  <label>Prompt
    <textarea id="prompt" placeholder="a pine tree"></textarea>
  </label>
  <div class="row" style="margin-top:.8rem">
    <label>Size
      <select id="ssize">
        <option value="256">256 px</option>
        <option value="512" selected>512 px</option>
        <option value="1024">1024 px</option>
      </select>
    </label>
    <label>Seed
      <input type="number" id="sseed" value="0" min="0" style="width:6rem">
    </label>
    <button class="go" id="go">Generate Sprite</button>
  </div>
  <div class="progress" id="progress"><div class="bar" id="bar"></div></div>
  <div class="status" id="status"></div>
  <div class="error" id="error"></div>
</div>

<div class="card">
  <h3 style="margin-top:0">Result</h3>
  <img id="spriteOut" alt="generated sprite">
  <div class="actions" id="actions"><a id="dl" href="#" download>Download .PNG</a></div>
</div>

<div class="note">Mock mode = placeholder sprites (no GPU here). Real generation
happens in Docker on your RTX 4060.</div>

<script>
const go = document.getElementById('go');
const bar = document.getElementById('bar');
const progress = document.getElementById('progress');
const statusEl = document.getElementById('status');
const errorEl = document.getElementById('error');
const spriteOut = document.getElementById('spriteOut');
const actions = document.getElementById('actions');
const dl = document.getElementById('dl');

go.addEventListener('click', async () => {
  errorEl.textContent = '';
  const prompt = document.getElementById('prompt').value.trim();
  if (!prompt) { errorEl.textContent = 'Type a prompt first.'; return; }
  go.disabled = true;
  bar.style.width = '0%';
  progress.style.display = 'block';
  statusEl.textContent = '';
  actions.style.display = 'none';
  spriteOut.style.display = 'none';
  try {
    const r = await fetch('/api/sprite', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prompt,
        seed: parseInt(document.getElementById('sseed').value || 0),
        size: parseInt(document.getElementById('ssize').value),
        steps: 4,
      }),
    });
    if (!r.ok) {
      const t = await r.text();
      throw new Error('sprite failed: HTTP ' + r.status + ' ' + t.slice(0, 200));
    }
    const { job_id } = await r.json();
    for (;;) {
      const s = await (await fetch('/api/status/' + job_id)).json();
      bar.style.width = Math.round((s.progress || 0) * 100) + '%';
      statusEl.textContent = s.status + ' — ' + (s.message || '');
      if (s.status === 'completed') break;
      if (s.status === 'failed' || s.status === 'cancelled')
        throw new Error('job ' + s.status + (s.error ? ': ' + s.error : ''));
      await new Promise(r => setTimeout(r, 1000));
    }
    const blob = await (await fetch('/api/result/' + job_id)).blob();
    const url = URL.createObjectURL(blob);
    spriteOut.src = url;
    spriteOut.style.display = 'block';
    dl.href = url;
    dl.download = 'plushy-sprite-' + job_id + '.png';
    actions.style.display = 'flex';
  } catch (e) { errorEl.textContent = String(e.message || e); }
  finally { go.disabled = false; }
});
</script>
</body>
</html>
